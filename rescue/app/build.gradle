plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxtools.adbrescue'
    compileSdk 34

    defaultConfig {
        applicationId "com.boxtools.adbrescue"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RESCUE_KEYSTORE_FILE")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("RESCUE_STORE_PASSWORD")
                keyAlias System.getenv("RESCUE_KEY_ALIAS")
                keyPassword System.getenv("RESCUE_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // No third-party dependencies; everything is hand-rolled on the framework APIs.
}
